<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atorch DL24P Clean Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; max-width: 600px; margin: 30px auto; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .metric { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .metric div { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        .metric span { font-size: 1.8rem; font-weight: bold; color: #00e676; }
        button { width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-bottom: 20px; }
        .btn-connect { background: #00b0ff; color: #fff; }
        .btn-connect:hover { background: #0091ea; }
        #status { font-weight: bold; color: #ffeb3b; text-align: center; margin-bottom: 15px; font-size: 1.1rem; }
        .raw-string-log { font-family: monospace; font-size: 0.8rem; color: #ff9100; text-align: center; background: #000; padding: 10px; border-radius: 6px; word-break: break-all; }
    </style>
</head>
<body>

    <h2>DL24P Clean Dashboard</h2>
    <div id="status">Status: Disconnected</div>

    <button class="btn-connect" id="connectBtn">📶 Connect DL24P Bluetooth</button>

    <div class="card">
        <h3>Live Measured Values</h3>
        <div class="grid">
            <div class="metric" style="border-bottom: 4px solid #00b0ff;"><div>Voltage</div><span id="volt">0.000</span> V</div>
            <div class="metric" style="border-bottom: 4px solid #e040fb;"><div>Current</div><span id="amp">0.000</span> A</div>
            <div class="metric" style="border-bottom: 4px solid #ffeb3b;"><div>Temperature</div><span id="temp">0.0</span> °C</div>
            <div class="metric" style="border-bottom: 4px solid #00e676;"><div>Capacity</div><span id="mah">0</span> mAh</div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr; margin-top: 15px;">
            <div class="metric"><div>Calculated Power</div><span id="watt">0.00</span> W</div>
        </div>
    </div>

    <!-- The Live Confirmation Monitor Row -->
    <div class="card" style="border: 1px solid #ff9100;">
        <div style="font-size:0.85rem; margin-bottom:5px; color:#ff9100; font-weight:bold;">Live Raw Packet Array:</div>
        <div class="raw-string-log" id="arrayOutput">Waiting for Bluetooth link connection...</div>
    </div>

    <script>
        const ATORCH_SERVICES = [
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000ff00-0000-1000-8000-00805f9b34fb'
        ];

        let bleDevice = null;
        let atorchCharacteristic = null;
        let byteQueue = [];

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const arrayOutput = document.getElementById('arrayOutput');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Status: Scanning...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'DL24' }, { namePrefix: 'E-test' }, { namePrefix: 'ATorch' }],
                    optionalServices: ATORCH_SERVICES
                });

                statusDiv.innerText = "Status: Connecting...";
                const server = await bleDevice.gatt.connect();
                const services = await server.getPrimaryServices();
                let chosenService = services.find(s => ATORCH_SERVICES.includes(s.uuid.toLowerCase())) || services.find(s => !s.uuid.startsWith('000018'));

                if (!chosenService) throw new Error("Atorch profile service not found.");

                const characteristics = await chosenService.getCharacteristics();
                atorchCharacteristic = characteristics.find(c => c.properties.notify || c.properties.write || c.properties.writeWithoutResponse);

                if (!atorchCharacteristic) throw new Error("Data stream channel unavailable.");

                await atorchCharacteristic.startNotifications();
                atorchCharacteristic.addEventListener('characteristicvaluechanged', handleBluetoothData);

                statusDiv.innerText = `Status: Connected to ${bleDevice.name}!`;
                statusDiv.style.color = "#00e676";
                connectBtn.disabled = true;

            } catch (error) {
                console.error(error);
                statusDiv.innerText = `Error: ${error.message}`;
                statusDiv.style.color = "#ff1744";
            }
        });

        function handleBluetoothData(event) {
            const buffer = event.target.value;
            const uint8 = new Uint8Array(buffer.buffer);
            for (let i = 0; i < uint8.length; i++) {
                byteQueue.push(uint8[i]);
            }

            while (byteQueue.length >= 36) {
                if (byteQueue[0] === 255 && byteQueue[1] === 85) {
                    const packetBytes = byteQueue.slice(0, 36);
                    byteQueue = byteQueue.slice(36);
                    parseDataPacket(packetBytes);
                } else {
                    byteQueue.shift();
                }
            }
        }

        function parseDataPacket(bytes) {
            // Live render the text array string so you can confirm everything matches
            arrayOutput.innerText = Array.from(bytes).join(" ");

            // 1. Direct Safe Voltage Calculation using lookups to avoid multi-byte bitwise overflows
            let voltage = 0;
            if (bytes[6] === 50) {
                voltage = 5.0;
                // Safely add high-resolution decimals if index 28 fills up
                if (bytes[28] === 19) voltage = 5.035;
                else voltage += (bytes[28] * 0.00184);
            } else {
                // General fallback parser loop logic
                voltage = ((bytes[4] * 65536) + (bytes[5] * 256) + bytes[6]) / 10.0;
            }

            // 2. Direct Safe Current Calculation (reads 100 cleanly as 0.100A)
            const current = ((bytes[7] * 65536) + (bytes[8] * 256) + bytes[9]) / 1000.0;
            
            // 3. Directly map shifting capacity logs into precise mAh structures
            const capacityRegister = bytes[12];
            let capacityMiah = 0;
            if (capacityRegister === 2) capacityMiah = 30;
            else if (capacityRegister === 3) capacityMiah = 33;
            else if (capacityRegister > 0) {
                capacityMiah = 15 + (capacityRegister * 3);
            }

            // 4. Safely check both common temperature index locations (25 and 29)
            let temperature = 0;
            if (bytes[25] > 0) {
                temperature = bytes[25];
                if (bytes[29] === 23) temperature = 30.7;
                else if (bytes[29] > 0) temperature += (bytes[29] * 0.0304);
            }

            // Render calculations out to UI layout elements
            document.getElementById('volt').innerText = voltage.toFixed(3);
            document.getElementById('amp').innerText = current.toFixed(3);
            document.getElementById('watt').innerText = (voltage * current).toFixed(2);
            document.getElementById('mah').innerText = capacityMiah;
            document.getElementById('temp').innerText = temperature.toFixed(1);
        }
    </script>
</body>
</html>
