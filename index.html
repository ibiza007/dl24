<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atorch DL24P Wireless Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .metric { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: center; }
        .metric div { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        .metric span { font-size: 1.8rem; font-weight: bold; color: #00e676; }
        button { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-connect { background: #00b0ff; color: #fff; }
        .btn-connect:hover { background: #0091ea; }
        .btn-toggle { background: #ffeb3b; color: #000; }
        .btn-toggle:hover { background: #fdd835; }
        .btn-reset { background: #757575; color: #fff; }
        .btn-reset:hover { background: #616161; }
        #status { font-weight: bold; color: #ffeb3b; text-align: center; margin-bottom: 15px; word-wrap: break-word; }
        #rawLog { background: #000; color: #00ff00; font-family: monospace; font-size: 0.8rem; padding: 10px; border-radius: 6px; max-height: 80px; overflow-y: scroll; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>DL24P Bluetooth Dashboard</h2>
    <div id="status">Status: Disconnected</div>

    <button class="btn-connect" id="connectBtn">📶 Connect DL24P Bluetooth</button>

    <div class="card">
        <h3>Wireless Telemetry</h3>
        <div class="grid">
            <div class="metric"><div>Voltage</div><span id="volt">0.0</span> V</div>
            <div class="metric"><div>Current</div><span id="amp">0.000</span> A</div>
            <div class="metric"><div>Power</div><span id="watt">0.0</span> W</div>
            <div class="metric"><div>Energy</div><span id="wh">0.000</span> Wh</div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr;">
            <div class="metric"><div>Capacity</div><span id="ah">0.000</span> Ah</div>
        </div>
    </div>

    <div class="card">
        <h3>Controls</h3>
        <button class="btn-toggle" id="toggleBtn" disabled>Toggle Load (On/Off)</button>
        <div class="grid">
            <button class="btn-reset" id="resetWhBtn" disabled>Reset Wh</button>
            <button class="btn-reset" id="resetAhBtn" disabled>Reset Ah</button>
        </div>
    </div>

    <div class="card">
        <h3>Raw Incoming Serial Log</h3>
        <div id="rawLog">Awaiting communication flow...</div>
    </div>

    <script>
        const KNOWN_SERIAL_SERVICES = [
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000ff00-0000-1000-8000-00805f9b34fb',
            '0000fff0-0000-1000-8000-00805f9b34fb',
            '00007777-0000-1000-8000-00805f9b34fb'
        ];

        let bleDevice = null;
        let serialCharacteristic = null;
        let pollInterval = null;
        let incomingTextBuffer = "";

        const connectBtn = document.getElementById('connectBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetWhBtn = document.getElementById('resetWhBtn');
        const resetAhBtn = document.getElementById('resetAhBtn');
        const statusDiv = document.getElementById('status');
        const rawLog = document.getElementById('rawLog');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Status: Scanning...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'DL24' },
                        { namePrefix: 'E-test' },
                        { namePrefix: 'JDY' },
                        { namePrefix: 'ATorch' }
                    ],
                    optionalServices: KNOWN_SERIAL_SERVICES
                });

                const server = await bleDevice.gatt.connect();
                const services = await server.getPrimaryServices();
                let chosenService = services.find(s => KNOWN_SERIAL_SERVICES.includes(s.uuid.toLowerCase())) || services.find(s => !s.uuid.startsWith('000018'));

                if (!chosenService) throw new Error("No data channel profiles found.");

                const characteristics = await chosenService.getCharacteristics();
                serialCharacteristic = characteristics.find(c => c.properties.notify || c.properties.write || c.properties.writeWithoutResponse);

                if (!serialCharacteristic) throw new Error("No communication paths found.");

                await serialCharacteristic.startNotifications();
                serialCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingText);

                statusDiv.innerText = `Status: Connected Wirelessly to ${bleDevice.name}!`;
                statusDiv.style.color = "#00e676";
                
                toggleBtn.disabled = false;
                resetWhBtn.disabled = false;
                resetAhBtn.disabled = false;
                connectBtn.disabled = true;

                // Fire an instant query command immediately upon binding
                await sendTextCommand("values?\r\n");

                // Continuous poll setup using corrected \r\n framing sequences
                pollInterval = setInterval(async () => {
                    await sendTextCommand("values?\r\n");
                }, 3000);

            } catch (error) {
                console.error(error);
                statusDiv.innerText = `Error: ${error.message}`;
                statusDiv.style.color = "#ff1744";
            }
        });

        function handleIncomingText(event) {
            const dataView = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const chunk = decoder.decode(dataView);
            
            // Print directly to the raw log screen so we can see if the DL24P is answering
            rawLog.innerText = `Received: ${chunk.trim()}`;

            incomingTextBuffer += chunk;

            if (incomingTextBuffer.includes('\n') || incomingTextBuffer.includes('\r')) {
                const lines = incomingTextBuffer.split(/[\r\n]+/);
                incomingTextBuffer = lines.pop();

                for (let line of lines) {
                    if (line.trim().length > 0) {
                        parseTextTelemetry(line.trim());
                    }
                }
            }
        }

        function parseTextTelemetry(dataString) {
            const values = dataString.split(/\s+/).map(Number);
            
            // Checks formatting and hooks fields cleanly to dashboard slots
            if (values.length >= 4 && !values.some(isNaN)) {
                document.getElementById('volt').innerText = values[0].toFixed(1);
                document.getElementById('amp').innerText  = values[1].toFixed(3);
                document.getElementById('watt').innerText = values[2].toFixed(1);
                if (values[3] !== undefined) document.getElementById('ah').innerText = values[3].toFixed(3);
                if (values[4] !== undefined) document.getElementById('wh').innerText = values[4].toFixed(3);
            }
        }

        async function sendTextCommand(textString) {
            if (!serialCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                const buffer = encoder.encode(textString);
                await serialCharacteristic.writeValue(buffer);
            } catch (error) {
                console.error("Transmission error:", error);
            }
        }

        toggleBtn.addEventListener('click', async () => {
            await sendTextCommand("tx 0x32\r\n");
        });

        resetWhBtn.addEventListener('click', async () => {
            await sendTextCommand("tx 1\r\n");
        });

        resetAhBtn.addEventListener('click', async () => {
            await sendTextCommand("tx 2\r\n");
        });
    </script>
</body>
</html>
