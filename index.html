<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atorch DL24P Bluetooth Monitor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; max-width: 500px; margin: 40px auto; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .metric { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .metric div { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        .metric span { font-size: 1.8rem; font-weight: bold; color: #00e676; }
        button { width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-connect { background: #00b0ff; color: #fff; }
        .btn-connect:hover { background: #0091ea; }
        #status { font-weight: bold; color: #ffeb3b; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>DL24P Bluetooth Monitor</h2>
    <div id="status">Status: Disconnected</div>

    <button class="btn-connect" id="connectBtn">📶 Connect DL24P Bluetooth</button>

    <div class="card">
        <div class="grid">
            <div class="metric"><div>Voltage</div><span id="volt">0.00</span> V</div>
            <div class="metric"><div>Current</div><span id="amp">0.00</span> A</div>
            <div class="metric"><div>Power</div><span id="watt">0.00</span> W</div>
            <div class="metric"><div>Temperature</div><span id="temp">0</span> °C</div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr;">
            <div class="metric"><div>Capacity</div><span id="mah">0</span> mAh</div>
        </div>
    </div>

    <script>
        const ATORCH_SERVICES = [
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000ff00-0000-1000-8000-00805f9b34fb'
        ];

        let bleDevice = null;
        let atorchCharacteristic = null;
        let byteQueue = [];

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Status: Scanning...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'DL24' },
                        { namePrefix: 'E-test' },
                        { namePrefix: 'ATorch' }
                    ],
                    optionalServices: ATORCH_SERVICES
                });

                statusDiv.innerText = "Status: Connecting...";
                const server = await bleDevice.gatt.connect();

                statusDiv.innerText = "Status: Finding Service...";
                const services = await server.getPrimaryServices();
                let chosenService = services.find(s => ATORCH_SERVICES.includes(s.uuid.toLowerCase())) || services.find(s => !s.uuid.startsWith('000018'));

                if (!chosenService) throw new Error("Atorch profile service not found.");

                statusDiv.innerText = "Status: Connecting Data Stream...";
                const characteristics = await chosenService.getCharacteristics();
                atorchCharacteristic = characteristics.find(c => c.properties.notify || c.properties.write || c.properties.writeWithoutResponse);

                if (!atorchCharacteristic) throw new Error("Data stream unavailable.");

                await atorchCharacteristic.startNotifications();
                atorchCharacteristic.addEventListener('characteristicvaluechanged', handleBluetoothData);

                statusDiv.innerText = `Status: Connected to ${bleDevice.name}!`;
                statusDiv.style.color = "#00e676";
                connectBtn.disabled = true;

            } catch (error) {
                console.error(error);
                statusDiv.innerText = `Error: ${error.message}`;
                statusDiv.style.color = "#ff1744";
            }
        });

        function handleBluetoothData(event) {
            const buffer = event.target.value;
            const uint8 = new Uint8Array(buffer.buffer);
            
            // Push incoming data stream bytes cleanly into our collector array
            for (let i = 0; i < uint8.length; i++) {
                byteQueue.push(uint8[i]);
            }

            // Fixed the syntax loop check: reading individual indexes properly
            while (byteQueue.length >= 36) {
                if (byteQueue[0] === 0xff && byteQueue[1] === 0x55) {
                    const packetBytes = byteQueue.slice(0, 36);
                    byteQueue = byteQueue.slice(36);
                    parseDataPacket(packetBytes);
                } else {
                    byteQueue.shift();
                }
            }
        }

        function parseDataPacket(bytes) {
            // Checked values calculations using precise array index mapping
            const voltage = ((bytes[4] * 65536) + (bytes[5] * 256) + bytes[6]) / 100.0;
            const current = ((bytes[7] * 65536) + (bytes[8] * 256) + bytes[9]) / 100.0;
            
            // Fixed capacity math to accurately calculate native mAh integers
            const capacityAh = ((bytes[10] * 65536) + (bytes[11] * 256) + bytes[12]) / 100.0;
            const capacityMiah = Math.round(capacityAh * 1000);

            // Read temperature field dynamically from target protocol locations
            let temp = bytes[24];
            if (temp === 0 || temp > 120) {
                temp = bytes[23];
            }

            // Bind values directly into screen container fields instantly
            document.getElementById('volt').innerText = voltage.toFixed(2);
            document.getElementById('amp').innerText = current.toFixed(2);
            document.getElementById('watt').innerText = (voltage * current).toFixed(2);
            document.getElementById('mah').innerText = capacityMiah;
            document.getElementById('temp').innerText = temp;
        }
    </script>
</body>
</html>
