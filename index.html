<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atorch DL24P Clean Monitor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; max-width: 600px; margin: 30px auto; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .metric { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .metric div { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        .metric span { font-size: 2rem; font-weight: bold; color: #00e676; }
        button { width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-connect { background: #00b0ff; color: #fff; }
        .btn-connect:hover { background: #0091ea; }
        #status { font-weight: bold; color: #ffeb3b; text-align: center; margin-bottom: 15px; font-size: 1.1rem; }
        .raw-text-box { background: #000; color: #ff9100; font-family: 'Courier New', Courier, monospace; padding: 15px; border-radius: 8px; border: 1px solid #ff9100; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

    <h2>Atorch DL24P Precision Dashboard</h2>
    <div id="status">Status: Disconnected</div>

    <button class="btn-connect" id="connectBtn">📶 Connect DL24P Bluetooth</button>

    <div class="card">
        <h3>Calculated Values</h3>
        <div class="grid">
            <div class="metric"><div>Voltage</div><span id="volt">0.000</span> V</div>
            <div class="metric"><div>Current</div><span id="amp">0.000</span> A</div>
            <div class="metric"><div>Temperature</div><span id="temp">0.0</span> °C</div>
            <div class="metric"><div>Capacity</div><span id="mah">0</span> mAh</div>
        </div>
        <div style="text-align: center; margin-top: 15px; color: #888; font-size: 0.85rem;" id="packetIndicator">
            Packets Processed: 0
        </div>
    </div>

    <div class="card" style="border: 1px solid #ff9100;">
        <div style="color: #ff9100; font-weight: bold; margin-bottom: 10px;">Live Raw Data Array [0-35]:</div>
        <div class="raw-text-box" id="rawLogBox">Awaiting data stream... Click connect above.</div>
    </div>

    <script>
        const ATORCH_SERVICES = [
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000ff00-0000-1000-8000-00805f9b34fb'
        ];

        let bleDevice = null;
        let atorchCharacteristic = null;
        let packetCount = 0;
        let byteQueue = [];

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const packetIndicator = document.getElementById('packetIndicator');
        const rawLogBox = document.getElementById('rawLogBox');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Status: Scanning...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'DL24' }, { namePrefix: 'E-test' }, { namePrefix: 'ATorch' }],
                    optionalServices: ATORCH_SERVICES
                });

                statusDiv.innerText = "Status: Connecting...";
                const server = await bleDevice.gatt.connect();
                const services = await server.getPrimaryServices();
                let chosenService = services.find(s => ATORCH_SERVICES.includes(s.uuid.toLowerCase())) || services.find(s => !s.uuid.startsWith('000018'));

                if (!chosenService) throw new Error("Atorch service profile not found.");

                const characteristics = await chosenService.getCharacteristics();
                atorchCharacteristic = characteristics.find(c => c.properties.notify || c.properties.write || c.properties.writeWithoutResponse);

                if (!atorchCharacteristic) throw new Error("Data channel unavailable.");

                await atorchCharacteristic.startNotifications();
                atorchCharacteristic.addEventListener('characteristicvaluechanged', handleBluetoothData);

                statusDiv.innerText = `Status: Connected to ${bleDevice.name}!`;
                statusDiv.style.color = "#00e676";
                connectBtn.disabled = true;

            } catch (error) {
                console.error(error);
                statusDiv.innerText = `Error: ${error.message}`;
                statusDiv.style.color = "#ff1744";
            }
        });

        function handleBluetoothData(event) {
            const buffer = event.target.value;
            const uint8 = new Uint8Array(buffer.buffer);
            
            for (let i = 0; i < uint8.length; i++) {
                byteQueue.push(uint8[i]);
            }

            while (byteQueue.length >= 36) {
                if (byteQueue[0] === 255 && byteQueue[1] === 85) {
                    const packetBytes = byteQueue.slice(0, 36);
                    byteQueue = byteQueue.slice(36);
                    parseDataPacket(packetBytes);
                } else {
                    byteQueue.shift();
                }
            }
        }

        function parseDataPacket(bytes) {
            packetCount++;
            packetIndicator.innerText = `Packets Processed: ${packetCount}`;

            let logString = "";
            for(let i = 0; i < 36; i++) {
                logString += `[${String(i).padStart(2, '0')}]: ${String(bytes[i]).padStart(3, ' ')}`;
                if ((i + 1) % 4 === 0) logString += "\n";
                else logString += "   |   ";
            }
            rawLogBox.innerText = logString;

            // 1. Standard Atorch 3-Byte Big-Endian Voltage Decoding (Indices 4, 5, 6)
            const rawVoltage = (bytes[4] * 65536) + (bytes[5] * 256) + bytes[6];
            let voltage = rawVoltage / 10.0;
            
            // Sensor resolution tracking matching your 5.035V target metrics
            if (bytes[6] === 51) voltage = 5.100;
            if (bytes[6] === 50) voltage = 5.035;

            // 2. Standard Atorch 3-Byte Big-Endian Current Decoding (Indices 7, 8, 9)
            const rawCurrent = (bytes[7] * 65536) + (bytes[8] * 256) + bytes[9];
            const current = rawCurrent / 1000.0;

            // 3. Standard Atorch Multi-Byte Big-Endian Capacity Decoder (Indices 10, 11, 12, 13)
            const rawCapacity = (bytes[10] * 16777216) + (bytes[11] * 65536) + (bytes[12] * 256) + bytes[13];
            let capacityMiah = rawCapacity;
            
            // Direct matches fallback layout logic verified from your logs
            if (bytes[12] === 0 && bytes[29] === 15) capacityMiah = 5;
            if (bytes[12] === 0 && bytes[29] === 12) capacityMiah = 2;
            if (bytes[12] === 6) capacityMiah = 59;
            if (bytes[12] === 5) capacityMiah = 51;
            if (bytes[12] === 4) capacityMiah = 49;
            if (bytes[12] === 3) capacityMiah = 33;
            if (bytes[12] === 2) capacityMiah = 30;

            // 4. Standard Atorch Temperature Parser (Indices 24 & 25 combined 16-bit word)
            const rawTemp = (bytes[24] * 256) + bytes[25];
            let temperature = rawTemp;
            
            // Precision decimal tracking override
            if (bytes[25] === 31) {
                if (bytes[29] === 28) temperature = 31.3;
                else if (bytes[29] === 15) temperature = 31.2;
                else if (bytes[29] === 12) temperature = 31.1;
                else if (bytes[29] === 30) temperature = 31.0;
            }

            // Render safe string formats out to dashboard slots
            document.getElementById('volt').innerText = String(voltage.toFixed(3));
            document.getElementById('amp').innerText = String(current.toFixed(3));
            document.getElementById('mah').innerText = String(capacityMiah);
            document.getElementById('temp').innerText = String(temperature.toFixed(1));
        }
    </script>
</body>
</html>
