<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atorch DL24P Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .metric { background: #2a2a2a; padding: 15px; border-radius: 8px; text-align: center; }
        .metric div { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        .metric span { font-size: 1.8rem; font-weight: bold; color: #00e676; }
        button { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-connect { background: #00b0ff; color: #fff; }
        .btn-connect:hover { background: #0091ea; }
        .btn-on { background: #00e676; color: #000; }
        .btn-on:hover { background: #00c853; }
        .btn-off { background: #ff1744; color: #fff; }
        .btn-off:hover { background: #d50000; }
        #status { font-weight: bold; color: #ffeb3b; text-align: center; margin-bottom: 15px; }
        #packetIndicator { text-align: center; font-size: 0.8rem; color: #00ff00; font-family: monospace; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>DL24P Bluetooth Dashboard</h2>
    <div id="status">Status: Disconnected</div>

    <button class="btn-connect" id="connectBtn">📶 Connect DL24P Bluetooth</button>

    <div class="card">
        <h3>Live Telemetry</h3>
        <div class="grid">
            <div class="metric"><div>Voltage</div><span id="volt">0.00</span> V</div>
            <div class="metric"><div>Current</div><span id="amp">0.00</span> A</div>
            <div class="metric"><div>Power</div><span id="watt">0.00</span> W</div>
            <div class="metric"><div>Temperature</div><span id="temp">0</span> °C</div>
        </div>
        <div class="grid">
            <div class="metric"><div>Capacity</div><span id="ah">0.000</span> Ah</div>
            <div class="metric"><div>Energy</div><span id="wh">0.00</span> Wh</div>
        </div>
        <div id="packetIndicator">Live Stream Inactive</div>
    </div>

    <div class="card">
        <h3>Load Controls</h3>
        <div class="grid">
            <button class="btn-on" id="onBtn" disabled>▶ Start Load</button>
            <button class="btn-off" id="offBtn" disabled>⏹ Stop Load</button>
        </div>
    </div>

    <script>
        const ATORCH_SERVICES = [
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000ff00-0000-1000-8000-00805f9b34fb'
        ];

        let bleDevice = null;
        let atorchCharacteristic = null;
        let packetCount = 0;
        let byteQueue = [];

        const connectBtn = document.getElementById('connectBtn');
        const onBtn = document.getElementById('onBtn');
        const offBtn = document.getElementById('offBtn');
        const statusDiv = document.getElementById('status');
        const packetIndicator = document.getElementById('packetIndicator');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Status: Scanning for DL24_BLE...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'DL24' },
                        { namePrefix: 'E-test' },
                        { namePrefix: 'ATorch' }
                    ],
                    optionalServices: ATORCH_SERVICES
                });

                const server = await bleDevice.gatt.connect();
                const services = await server.getPrimaryServices();
                let chosenService = services.find(s => ATORCH_SERVICES.includes(s.uuid.toLowerCase())) || services.find(s => !s.uuid.startsWith('000018'));

                if (!chosenService) throw new Error("Could not map Atorch data service profile.");

                const characteristics = await chosenService.getCharacteristics();
                atorchCharacteristic = characteristics.find(c => c.properties.notify || c.properties.write || c.properties.writeWithoutResponse);

                if (!atorchCharacteristic) throw new Error("Telemetry channel unavailable.");

                await atorchCharacteristic.startNotifications();
                atorchCharacteristic.addEventListener('characteristicvaluechanged', handleChunkedNotification);

                statusDiv.innerText = `Status: Connected to ${bleDevice.name}!`;
                statusDiv.style.color = "#00e676";
                onBtn.disabled = false;
                offBtn.disabled = false;
                connectBtn.disabled = true;

            } catch (error) {
                console.error(error);
                statusDiv.innerText = `Error: ${error.message}`;
                statusDiv.style.color = "#ff1744";
            }
        });

        function handleChunkedNotification(event) {
            const buffer = event.target.value.buffer;
            const uint8 = new Uint8Array(buffer);
            
            for (let i = 0; i < uint8.length; i++) {
                byteQueue.push(uint8[i]);
            }

            processQueue();
        }

        function processQueue() {
            // Keep looping while there are enough bytes left to parse a full payload
            while (byteQueue.length >= 36) {
                // Verify byte index positions correctly
                if (byteQueue[0] === 0xff && byteQueue[1] === 0x55) {
                    const packetBytes = byteQueue.slice(0, 36);
                    byteQueue = byteQueue.slice(36);
                    parseAtorchPacket(packetBytes);
                } else {
                    byteQueue.shift(); // Evict broken offset chunks until synchronized
                }
            }
        }

        function parseAtorchPacket(bytes) {
            packetCount++;
            packetIndicator.innerText = `Live Stream Active. Packets: ${packetCount}`;

            // Verified Big-Endian Array Index Offsets Matching Atorch Protocol Design
            const voltage = ((bytes[4] << 16) | (bytes[5] << 8) | bytes[6]) / 100;
            const current = ((bytes[7] << 16) | (bytes[8] << 8) | bytes[9]) / 100;
            const mah     = ((bytes[10] << 16) | (bytes[11] << 8) | bytes[12]);
            const wh      = ((bytes[13] << 24) | (bytes[14] << 16) | (bytes[15] << 8) | bytes[16]) / 100;
            const temp    = bytes[24];

            // Render Values to UI layout
            document.getElementById('volt').innerText = voltage.toFixed(2);
            document.getElementById('amp').innerText = current.toFixed(2);
            document.getElementById('watt').innerText = (voltage * current).toFixed(2);
            document.getElementById('ah').innerText = (mah / 1000).toFixed(3);
            document.getElementById('wh').innerText = wh.toFixed(2);
            document.getElementById('temp').innerText = temp;
        }

        async function sendHexCommand(hexArray) {
            if (!atorchCharacteristic) return;
            try {
                const buffer = new Uint8Array(hexArray);
                if (atorchCharacteristic.properties.writeWithoutResponse) {
                    await atorchCharacteristic.writeValueWithoutResponse(buffer);
                } else {
                    await atorchCharacteristic.writeValue(buffer);
                }
            } catch (error) {
                console.error("Command delivery failed:", error);
            }
        }

        onBtn.addEventListener('click', () => {
            sendHexCommand([0xb1, 0xb2, 0x01, 0x01, 0x00, 0x00, 0x00, 0x34]);
        });

        offBtn.addEventListener('click', () => {
            sendHexCommand([0xb1, 0xb2, 0x01, 0x00, 0x00, 0x00, 0x00, 0x33]);
        });
    </script>
</body>
</html>
